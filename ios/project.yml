# XcodeGen spec.
#
# A generated PMThinkingCoach.xcodeproj is committed so the project opens straight from
# a clone. If it ever drifts or fails to open, regenerate it:
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# This file is the source of truth for project settings.

name: PMThinkingCoach

options:
  bundleIdPrefix: com.pmthinkingcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Left at the default. Raise to `targeted` and then `complete` once the app builds
    # cleanly; doing it before the first successful build buries real errors in noise.
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  PMThinkingCoach:
    type: application
    platform: iOS
    sources:
      - path: PMThinkingCoach
    settings:
      base:
        PRODUCT_NAME: PMThinkingCoach
        PRODUCT_BUNDLE_IDENTIFIER: com.pmthinkingcoach.app
        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Supporting/PMThinkingCoach.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (spec §6)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        # No AI provider key is ever configured here. The client talks only to our API.
        Debug:
          API_BASE_URL: http://192.168.1.252:8000
        Release:
          API_BASE_URL: https://api.pmthinkingcoach.example

  PMThinkingCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PMThinkingCoachTests
    dependencies:
      - target: PMThinkingCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmthinkingcoach.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PMThinkingCoach:
    build:
      targets:
        PMThinkingCoach: all
    test:
      targets:
        - PMThinkingCoachTests
      gatherCoverageData: true
    run:
      config: Debug
